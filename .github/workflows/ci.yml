name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi
          POSTGRES_DB: lumi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumi" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lumi:lumi@localhost:5432/lumi_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: i18n catalogs in sync with web
        run: ./tool/sync_i18n.sh && git diff --exit-code assets/i18n
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
