name: lumi
description: Lumi by Beyondex — team task management & planning.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  shamsi_date: ^1.1.1
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.0.2
  intl: any
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
  fonts:
    - family: Meem
      fonts:
        - asset: assets/fonts/Meem-Light.ttf
          weight: 300
        - asset: assets/fonts/Meem-Regular.ttf
          weight: 400
        - asset: assets/fonts/Meem-Medium.ttf
          weight: 500
        - asset: assets/fonts/Meem-DemiBold.ttf
          weight: 600
        - asset: assets/fonts/Meem-Bold.ttf
          weight: 700
