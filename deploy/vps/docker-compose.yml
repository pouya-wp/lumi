# Lumi on a small shared VPS — the whole app (web, API, database) behind ONE port.
# - Only ${LUMI_PORT} is published (default 8088); nginx, 80/443 and other services are not touched.
# - Own network and named volumes; memory-capped so existing services keep their headroom.
# Managed by install.sh (project "lumi-vps"); config lives in /opt/lumi/.env.
name: lumi-vps

services:
  proxy:
    image: ${LUMI_CADDY_IMAGE:-ghcr.io/pouya-wp/lumi-caddy:2}
    restart: unless-stopped
    depends_on: [web, api]
    ports: ["${LUMI_PORT:-8088}:80"]
    volumes: [/opt/lumi/Caddyfile:/etc/caddy/Caddyfile:ro]
    mem_limit: 64m
    networks: [lumi]

  web:
    image: ${LUMI_WEB_IMAGE:-ghcr.io/pouya-wp/lumi-web:latest}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    networks: [lumi]

  api:
    image: ${LUMI_API_IMAGE:-ghcr.io/pouya-wp/lumi-api:latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://lumi:${POSTGRES_PASSWORD}@postgres:5432/lumi?connection_limit=5
      JWT_SECRET: ${JWT_SECRET:?missing JWT_SECRET}
      PUBLIC_API_URL: ${LUMI_PUBLIC_URL:?missing LUMI_PUBLIC_URL}
      PUBLIC_WEB_URL: ${LUMI_PUBLIC_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      TEAM_EMAILS: ${TEAM_EMAILS:-}
    mem_limit: 384m
    networks: [lumi]

  postgres:
    image: ${LUMI_POSTGRES_IMAGE:-ghcr.io/pouya-wp/lumi-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
      POSTGRES_DB: lumi
    command: [postgres, -c, shared_buffers=64MB, -c, effective_cache_size=192MB, -c, work_mem=4MB, -c, maintenance_work_mem=32MB, -c, max_connections=30, -c, wal_buffers=4MB]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi"]
      interval: 5s
      retries: 30
    networks: [lumi]

  backup:
    image: ${LUMI_POSTGRES_IMAGE:-ghcr.io/pouya-wp/lumi-postgres:16}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: [/opt/lumi/backups:/backups]
    mem_limit: 64m
    networks: [lumi]
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/lumi-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h postgres -U lumi lumi | gzip > "$$f" && echo "backup $$f"
          find /backups -name 'lumi-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

networks:
  lumi:
    name: lumi-vps

volumes:
  pgdata:
    name: lumi-vps-pgdata
